name: Format website redesign branch

on:
  pull_request:
    branches: [main]
    paths:
      - "_pages/**"
      - "_config.yml"
      - "assets/css/**"
      - "assets/json/**"
      - "test/visual/**"
      - ".github/workflows/**"

permissions:
  contents: write

jobs:
  format-redesign:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'website-redesign-2026'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout redesign branch
        uses: actions/checkout@v4
        with:
          ref: website-redesign-2026
          persist-credentials: true
      - name: Node setup
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Apply repository Prettier rules to changed portfolio files
        run: |
          npx prettier --write _config.yml \
            _pages/about.md _pages/about_me.md _pages/blog.md \
            _pages/research.md _pages/publications.md _pages/projects.md \
            _pages/cv.md _pages/contact.md \
            _news/2026-04-22-cxrg-submitted.md \
            assets/css/academic.css assets/json/resume.json \
            test/visual/academic.spec.js \
            .github/workflows/visual-regression.yml \
            .github/workflows/unit-tests.yml \
            .github/workflows/prettier.yml
      - name: Commit formatting to development branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _config.yml _pages/about.md _pages/about_me.md _pages/blog.md \
            _pages/research.md _pages/publications.md _pages/projects.md \
            _pages/cv.md _pages/contact.md \
            _news/2026-04-22-cxrg-submitted.md \
            assets/css/academic.css assets/json/resume.json \
            test/visual/academic.spec.js \
            .github/workflows/visual-regression.yml \
            .github/workflows/unit-tests.yml \
            .github/workflows/prettier.yml
          if ! git diff --cached --quiet; then
            git commit -m "Apply Prettier to redesigned academic site files"
            git push origin HEAD:website-redesign-2026
          fi
